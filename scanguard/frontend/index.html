<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="ScanGuard AI - Smart Mobile Barcode Scan & Go Checkout with Retail Loss Prevention" />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ScanGuard" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>ScanGuard AI — Mobile Checkout</title>
  </head>
  <body class="bg-slate-50 text-slate-900 select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('ScanGuard PWA ServiceWorker registered:', reg.scope);
          }).catch((err) => {
            console.log('ScanGuard ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>

name: Build & Release Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopscan-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "ShopScan AI Flutter v1.0.0 (Android APK)"
          body: |
            ### 🛒 ShopScan AI — Native Flutter Mobile App
            
            Download the Android APK below and install it directly on your Android phone!
            
            - **Filename:** `app-release.apk`
            - **Platform:** Android 6.0+ (Universal APK)
            - **Features:**
              - Live Barcode Scanning with animated laser viewfinder
              - Smart Cart & Load Cell Weight Telemetry
              - AI Loss-Prevention Clearance Banner
              - Animated Turnstile QR Exit Pass
              - Store Security & Discrepancy Operations Terminal
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
